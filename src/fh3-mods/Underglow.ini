[Underglow]
; 0 to 17 are FH2 presets. 18 to 27 are Custom 1 to 10.
PaletteVersion=2
PrimaryColor=0
SecondaryColor=0
; Use ANNA to browse the effect groups. These are the FH2 effect IDs.
FrontEffect=0
RightEffect=0
RearEffect=0
LeftEffect=0
; 1.0 is 100 percent. Speed is in cycles per second.
Brightness=0.5
Speed=0.65
Front=1
Right=1
Rear=1
Left=1
; Car-local geometry in meters. Restart the game after editing.
GeometryVersion=2
; Fit to the car's active bumpers and side skirts. Set to 0 for fixed dimensions.
AutoFit=1
HalfWidth=0.80
BodyHalfLength=2.00
Height=0.01
; In AutoFit, bumper insets are measured from the fitted bumper edges.
FrontInset=0.5
RearInset=0.7
SideOffset=-0.2
; AutoFit uses 15% at each skirt end and 85% with body or light bounds.
SideTrim=0.8
Range=1.0
Power=4.0

