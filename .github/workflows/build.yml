name: Build Underglow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        edition: [Standalone, ExtraOptions]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build ${{ matrix.edition }}
        shell: cmd
        run: build.cmd ${{ matrix.edition }}
